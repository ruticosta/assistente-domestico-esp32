services:
  postgres:
    image: postgres:16-alpine
    container_name: assistente_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-assistente}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-assistente123}
      POSTGRES_DB: ${POSTGRES_DB:-assistente_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistente -d assistente_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: assistente_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://assistente:assistente123@postgres:5432/assistente_db
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/static:/app/static

volumes:
  postgres_data:
